name: Deploy Production

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.claude/**'
      - 'skills-lock.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a running production deploy: it would leave SST state locked.
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: Production
      url: https://www.tvseri.es
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}
      VERCEL_TELEMETRY_DISABLED: 1
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: eu-west-2

      - name: Setup AWS Profile
        run: |
          aws configure set region eu-west-2 --profile tvseries-production
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID" --profile tvseries-production
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY" --profile tvseries-production
          aws configure set aws_session_token "$AWS_SESSION_TOKEN" --profile tvseries-production

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Gate: nothing below runs (no secrets, no deploy) unless these pass.
      - name: Format and lint
        run: pnpm format-and-lint

      - name: Check for unused code
        run: pnpm knip

      - name: Check types
        run: pnpm check-types

      - name: Test
        run: pnpm test

      - name: Add SST bin to PATH (workaround for SST issue #6314)
        run: echo "$HOME/.config/sst/bin" >> $GITHUB_PATH

      - name: Setup SST secrets
        env:
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          TMDB_API_ACCESS_TOKEN: ${{ secrets.TMDB_API_ACCESS_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          pnpm sst secret set MdblistApiKey "$MDBLIST_API_KEY" --stage production
          pnpm sst secret set OmdbApiKey "$OMDB_API_KEY" --stage production
          pnpm sst secret set TmdbApiAccessToken "$TMDB_API_ACCESS_TOKEN" --stage production
          pnpm sst secret set TmdbApiKey "$TMDB_API_KEY" --stage production
          pnpm sst secret set GoogleClientId "$GOOGLE_CLIENT_ID" --stage production
          pnpm sst secret set SessionSecret "$SESSION_SECRET" --stage production

      - name: Deploy Production
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          AWS_HOSTED_ZONE_ID_PROD: ${{ secrets.AWS_HOSTED_ZONE_ID_PROD }}
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
        run: pnpm sst deploy --stage production

      - name: Unlock SST on failure
        if: ${{ failure() || cancelled() }}
        run: pnpm sst unlock --stage production
