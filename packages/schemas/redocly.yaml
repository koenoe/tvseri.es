# TMDB publishes its OpenAPI descriptions through its ReadMe developer site
# (the "OAS" link in the header of developer.themoviedb.org). Regenerate the
# types with `pnpm --filter @tvseri.es/schemas extract-tmdb-types`.
apis:
  tmdb-v3:
    root: https://developer.themoviedb.org/openapi/tmdb-api.json
    x-openapi-ts:
      output: ./tmdb-v3.d.ts
  tmdb-v4:
    root: https://developer.themoviedb.org/v4/openapi/tmdb-api.json
    x-openapi-ts:
      output: ./tmdb-v4.d.ts
