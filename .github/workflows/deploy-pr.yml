name: Deploy PR

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.claude/**'
      - 'skills-lock.json'

# Shared with cleanup-pr.yml, so a cleanup waits for a running deploy
# instead of failing on the stage lock.
concurrency:
  group: pr-stage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: Preview
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}
      VERCEL_TELEMETRY_DISABLED: 1
      NEXT_TELEMETRY_DISABLED: 1

    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEV }}
          aws-region: eu-west-2

      - name: Setup AWS Profile
        run: |
          aws configure set region eu-west-2 --profile tvseries-dev
          aws configure set aws_access_key_id ${{ env.AWS_ACCESS_KEY_ID }} --profile tvseries-dev
          aws configure set aws_secret_access_key ${{ env.AWS_SECRET_ACCESS_KEY }} --profile tvseries-dev
          aws configure set aws_session_token ${{ env.AWS_SESSION_TOKEN }} --profile tvseries-dev

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Add SST bin to PATH (workaround for SST issue #6314)
        run: echo "$HOME/.config/sst/bin" >> $GITHUB_PATH

      - name: Setup SST secrets
        run: |
          pnpm sst secret set MdblistApiKey "${{ secrets.MDBLIST_API_KEY }}" --stage pr-${{ github.event.pull_request.number }}
          pnpm sst secret set TmdbApiAccessToken "${{ secrets.TMDB_API_ACCESS_TOKEN }}" --stage pr-${{ github.event.pull_request.number }}
          pnpm sst secret set TmdbApiKey "${{ secrets.TMDB_API_KEY }}" --stage pr-${{ github.event.pull_request.number }}
          pnpm sst secret set GoogleClientId "${{ secrets.GOOGLE_CLIENT_ID }}" --stage pr-${{ github.event.pull_request.number }}
          pnpm sst secret set SessionSecret "${{ secrets.SESSION_SECRET }}" --stage pr-${{ github.event.pull_request.number }}

      - name: Deploy PR
        id: deploy
        env:
          AWS_HOSTED_ZONE_ID_DEV: ${{ secrets.AWS_HOSTED_ZONE_ID_DEV }}
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          GODEBUG: asyncpreemptoff=1
        run: |
          set -o pipefail
          OUTPUT=$(pnpm sst deploy --stage pr-${{ github.event.pull_request.number }} 2>&1 | tee /dev/stderr)
          # Extract the web URL from SST output
          # Try custom domain first, fall back to Vercel URL
          WEB_URL=$(echo "$OUTPUT" | grep -oE 'https://www.pr-[0-9]+\.dev\.tvseri\.es' | head -1 || \
                    echo "$OUTPUT" | grep -oE 'https://[a-z0-9-]+\.vercel\.app' | head -1 || \
                    echo "")
          echo "web_url=$WEB_URL" >> $GITHUB_OUTPUT

      - name: Unlock SST on failure
        if: ${{ failure() || cancelled() }}
        run: pnpm sst unlock --stage pr-${{ github.event.pull_request.number }}

      - name: Update PR with Preview URL
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const webUrl = '${{ steps.deploy.outputs.web_url }}';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(comment =>
              comment.user.login === 'github-actions[bot]' &&
              comment.body.includes('Preview environment')
            );

            // No URL yet
            if (!webUrl) {
              // Update existing comment to show in progress
              if (existingComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existingComment.id,
                  body: `## Preview environment\n\nDeployment in progress...`,
                });
              }
              // No existing comment and no URL = don't create comment yet
              return;
            }

            // We have a URL - create or update comment
            const commentBody = `## Preview environment\n\n${webUrl}\n\n> Auto-updates with new commits. Removed when PR is closed.`;

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody,
              });
            }
